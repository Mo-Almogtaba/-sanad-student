{% extends 'base.html' %}
{% load static %}

{% block title %}تعديل إعلان - {{ SITE_NAME }}{% endblock %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/panel.css' %}">

<div class="page-hero">
    <h1>✏️ تعديل الإعلان</h1>
    <p>{{ announcement.title }}</p>
</div>

<div class="container py-5">

    <div class="panel-toolbar">
        <a href="{% url 'panel:announcements' %}" class="btn-outline btn-sm">
            <i class="fa-solid fa-arrow-right"></i> العودة
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="info-card">
                <div class="info-card-header">
                    <i class="fa-solid fa-edit"></i>
                    <h3>تعديل البيانات</h3>
                </div>

                <form id="editForm" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">العنوان *</label>
                        <input type="text" name="title" class="form-control" 
                               value="{{ announcement.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">الوصف</label>
                        <textarea name="description" class="form-control" rows="3">{{ announcement.description }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">الرابط</label>
                            <input type="text" name="link" class="form-control" 
                                   value="{{ announcement.link }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">نص الزر</label>
                            <input type="text" name="button_text" class="form-control" 
                                   value="{{ announcement.button_text }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label fw-bold">لون الخلفية</label>
                            <input type="text" name="bg_color" class="form-control" 
                                   value="{{ announcement.bg_color }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">الترتيب</label>
                            <input type="number" name="order" class="form-control" 
                                   value="{{ announcement.order }}">
                        </div>
                    </div>

                    {% if announcement.image %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">الصورة الحالية</label>
                        <div class="file-preview mb-2">
                            <img src="{{ announcement.image.url }}" 
                                 style="max-width:100%; border-radius:10px;">
                        </div>
                        <div class="form-check">
                            <input type="checkbox" name="remove_image" class="form-check-input" 
                                   id="remove_image">
                            <label class="form-check-label" for="remove_image">
                                حذف الصورة الحالية
                            </label>
                        </div>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            {% if announcement.image %}تغيير الصورة{% else %}الصورة (اختياري){% endif %}
                        </label>
                        <input type="file" name="image" class="form-control" 
                               accept="image/*">
                        <small class="text-muted">المقاس المثالي: 1200×400 بكسل</small>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" name="is_active" class="form-check-input" 
                               id="is_active" {% if announcement.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">
                            مفعّل
                        </label>
                    </div>

                    <button type="button" class="submit-btn" onclick="saveAnn()">
                        <i class="fa-solid fa-save"></i> حفظ التعديلات
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>

<script>
function getCookie(name) {
    let v = null;
    if (document.cookie) {
        const cs = document.cookie.split(';');
        for (let i = 0; i < cs.length; i++) {
            const c = cs[i].trim();
            if (c.substring(0, name.length + 1) === (name + '=')) {
                v = decodeURIComponent(c.substring(name.length + 1));
                break;
            }
        }
    }
    return v;
}

function saveAnn() {
    const form = document.getElementById('editForm');
    const formData = new FormData(form);

    fetch('{% url "panel:announcement_update" announcement.pk %}', {
        method: 'POST',
        headers: {'X-CSRFToken': getCookie('csrftoken')},
        body: formData,
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            alert('✅ تم حفظ التعديلات');
            location.reload();
        } else {
            alert('❌ ' + data.error);
        }
    })
    .catch(() => alert('❌ خطأ في الاتصال'));
}
</script>

{% endblock %}
